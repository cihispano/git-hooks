stages:
  - validate
  - quality
  - hooks

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

.setup_php:
  before_script:
    - apt-get update
    - apt-get install -y git unzip libonig-dev libxml2-dev
    - docker-php-ext-install mbstring dom xml xmlwriter
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer --version
    - php --version
    - composer validate --strict
    - composer install --prefer-dist --no-progress
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .composer-cache/
      - vendor/

validate:composer:
  stage: validate
  image: php:8.1-cli
  extends: .setup_php
  script:
    - composer validate --strict

quality:matrix:
  stage: quality
  extends: .setup_php
  image: php:${PHP_VERSION}-cli
  parallel:
    matrix:
      - PHP_VERSION: ["8.1", "8.2", "8.3", "8.4"]
  script:
    - composer test
    - composer analyze
    - vendor/bin/phpunit --configuration phpunit.xml.dist --no-coverage --fail-on-skipped tests/Unit/HooksSmokeTest.php

coding-style:php8.1:
  stage: quality
  image: php:8.1-cli
  extends: .setup_php
  script:
    - composer sniff
    - composer cs

hooks:shellcheck:
  stage: hooks
  image: koalaman/shellcheck-alpine:latest
  script:
    - shellcheck --severity=error src/Hooks/pre-commit src/Hooks/pre-push src/Hooks/commit-msg
